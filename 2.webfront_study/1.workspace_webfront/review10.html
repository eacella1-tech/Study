<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{box-sizing: border-box;}
        div{border : 1px solid black;}

        .container {
            width: 500px;
            height: 5000px;
            margin: auto;
            position: relative;
        }

        .box {
            width: 100px;
            height: 100px;
            position: fixed;
            left: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
