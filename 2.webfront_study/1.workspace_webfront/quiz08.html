<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Cards</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: black;
        }

        .container {
            width: 1000px;
            height: 700px;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        .box {
            width: 250px;
            height: 350px;

            position: absolute;

            background-color: white;
            border: 1px solid black;

            text-align: center;

            transition: 0.5s;
        }

        .box:hover {
            cursor: pointer;
            z-index: 10;
        }

        #box1:active {
            transform: rotate(0deg) scale(1.4);
            z-index: 20;
        }

        .photo {
            width: 100%;
            height: 80%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo img {
            width: 220px;
            height: 260px;

            object-fit: cover;
        }

        .text {
            width: 100%;
            height: 20%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #box1 {
            left: 200px;
            top: 150px;

            transform: rotate(-15deg);
        }

        #box2 {
            left: 350px;
            top: 170px;

            transform: rotate(10deg);
        }
        #box2:active {
            transform: rotate(0deg) scale(1.4);
            z-index: 20;
        }

        #box3 {
            left: 500px;
            top: 200px;

            transform: rotate(-5deg);
        }
        #box3:active {
            transform: rotate(0deg) scale(1.4);
            z-index: 20;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="box1" class="box">
            <div class="photo">
                <img src="https://picsum.photos/220/260?random=1">
            </div>
            <div class="text">
                2026.08.24
            </div>
        </div>
        <div id="box2" class="box">
            <div class="photo">
                <img src="https://picsum.photos/220/260?random=2">
            </div>
            <div class="text">
                2026.05.20
            </div>
        </div>
        <div id="box3" class="box">
            <div class="photo">
                <img src="https://picsum.photos/220/260?random=3">
            </div>
            <div class="text">
                2026.12.25
            </div>
        </div>

    </div>

</body>

</html>
