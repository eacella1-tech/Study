<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0px;
        }
        ul {
            padding: 0px;
            margin: 0px;
            overflow: hidden;
            height: 30px;
        }

        li {
            list-style-type: none;
            float: left;
            width: 25%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        li:hover {
            cursor:pointer;
            background-color: tomato;
            color: white;
            transition-duration: 0.5s;
        }
        
    </style>
</head>

<body>
    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Board</li>
        <li>Contact</li>
    </ul>
</body>

</html>
