<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        div {
            border: 1px solid black;
        }

        .container {
            width: 600px;
            height: 200px;
            margin: auto;
        }

        .box {
            width: 100%;
            height: 50%;
        }
        .box1 {
            width: 25%;
            height: 100%;
            float : left;
        }
        .box2 {
            width : 70%;
            height: 100%;
            float : left;
        }

        #box2-1 {
            width: 62%;
        }
        #box2-2 {
            width: 38%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <div class = "box1"></div>
            <div class = "box1"></div>
            <div class = "box1"></div>
            <div class = "box1"></div>
        </div>
        <div class="box">
            <div id = "box2-1" class = "box2"></div>
            <div id = "box2-2" class = "box2"></div>
        </div>
    </div>

    </div>
</body>

</html>
