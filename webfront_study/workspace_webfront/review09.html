<!DOCTYPE html>
<html lang="en">


<!-- position : absolute -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        div {
            border: 1px solid black;
        }

        .container {
            width: 500px;
            height: 500px;
            margin: auto;
            position: relative;
        }

        .box {
            width: 100px;
            height: 100px;
        }

        #box1 {
            position: absolute;
            right: 0px;
        }

        #box2 {
            position: absolute;
            right: 0px;
            top: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="box1" class="box"></div>
        <div id="box2" class="box"></div>
    </div>
</body>

</html>
