<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form action="exam01.html" id="frm">
        <input id="input" type="text" placeholder="input your phone number">
        <input type="submit">
    </form>
    <script>
        let frm = document.getElementById("frm");
        let input = document.getElementById("input");
        let regex = /^010-?\d{4}-?\d{4}$/;
        
        frm.onsubmit = function () {
            if (!regex.exec(input.value)) {
                alert("올바르지 않습니다.");
                input.value = "";
                input.focus();
                return false;
            } 
        }
    </script>
</body>

</html>
