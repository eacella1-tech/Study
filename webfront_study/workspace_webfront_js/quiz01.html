<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- JavaScript 의 제어문은 Java와 100% 동일함.-->

    <script>
        let fruit = prompt("좋아하는 과일을 선택하세요.\n1. 사과 2. 포도 3. 딸기");

        if (fruit == "1") {
            document.write("Apple");
        } else if (fruit == "2") {
            document.write("Grape");
        } else if (fruit == "3") {
            document.write("Strawberry");
        } else {
            alert("잘못 입력했습니다.");
        }

    </script>
</body>

</html>
