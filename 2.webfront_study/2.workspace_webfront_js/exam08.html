<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let arr = [1,2,3,4,5,6,7,8];
        // slice - 배열 내에서 특정 범위 내 요소들을 추출하는 기능 ( 원본 수정은 X )
        // 파라미터1 : 시작위치 ( Inclusive )
        // 파라미터2 : 끝위치 ( Exclusive )

        // let sub = arr.slice(1, 4);
        // console.log(sub);

        // splice - 배열 내에서 특정 시작 위치부터 특정 개수만큼의 데이터를 삭제하거나,
        //          특정 위치에 데이터를 끼워넣는 함수 ( 원본 수정 O )
        // 파라미터1 : 시작위치 ( Inclusive )
        // 파라미터2 : 삭제 할 데이터의 개수
        // 파라미터3 (선택항목) : 시작 위치 지점에 추가 또는 교체 할 데이터 - 추가/교체 기능으로 전환

        console.log(arr); // 원본 출력

        arr.splice(2,0,99);

        console.log(arr);
    </script>
</body>

</html>
