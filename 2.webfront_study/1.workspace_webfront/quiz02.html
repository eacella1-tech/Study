<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        div {
            border : 1px solid black;
        }
        .container {
            margin: auto;
            width: 300px;
            height: 300px;
        }
        .box {
            width: 100%;
            height: 25%;
        }
    </style>
</head>
    
<body>
    <div class = "container">
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
    </div>    
</body>

</html>
