<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f6f8;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            padding: 35px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        h2 {
            margin: 0 0 30px;
            text-align: center;
            font-size: 24px;
        }

        fieldset {
            margin: 0 0 20px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        legend {
            padding: 0 8px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .item {
            display: inline-block;
            width: 49%;
            margin-bottom: 15px;
            vertical-align: top;
        }

        .item label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .item input {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f8f8f8;
            font-size: 13px;
            color: #555;
        }

        .item input:focus {
            outline: none;
            border-color: #555;
            background-color: white;
        }

        .address .item:nth-child(1) {
            width: 100%;
        }

        .address .item:nth-child(2) {
            width: 50%;
        }

        .address .item:nth-child(3) {
            width: 100%;
        }

        .button-wrap {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .button-wrap button {
            width: 120px;
            height: 42px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .button-wrap button:first-child {
            background-color: #333;
            color: white;
        }

        .button-wrap button:first-child:hover {
            background-color: #222;
        }

        .button-wrap button:last-child {
            background-color: #eee;
            color: #444;
        }

        .button-wrap button:last-child:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>마이페이지</h2>

        <fieldset>
            <legend>기본 계정 정보</legend>

            <div class="item">
                <label>아이디</label>
                <input type="text">
            </div>

            <div class="item">
                <label>이름</label>
                <input type="text">
            </div>

            <div class="item">
                <label>연락처</label>
                <input type="text">
            </div>

            <div class="item">
                <label>이메일</label>
                <input type="text">
            </div>

            <div class="item">
                <label>비밀번호</label>
                <input type="password">
            </div>

            <div class="item">
                <label>가입일자</label>
                <input type="text">
            </div>

        </fieldset>

        <fieldset class="address">
            <legend>주소 정보</legend>

            <div class="item">
                <label>우편 번호</label>
                <input type="text">
            </div>

            <div class="item">
                <label>기본주소</label>
                <input type="text">
            </div>

            <div class="item">
                <label>상세주소</label>
                <input type="text">
            </div>

        </fieldset>

        <div class="button-wrap">
            <button>수정</button>
            <button>홈으로</button>
        </div>

    </div>

</body>

</html>
