<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .container {
            width: 600px;
            height: 400px;
            margin: auto;
        }
        .row1 {
            width: 100%;
            height: 85%;
        }
        .row2 {
            width: 100%;
            height: 15%;
        }
        .rowA {
            float: left;
            width: 13%;
            height: 100%;
            background-color: dodgerblue;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 336.3px;
        }
        .rowB {
            float: left;
            width: 87%;
            height: 100%;
        }

        .rowC {
            float:left;
            width: 90%;
            height : 100%;
            background-color: grey;
        }
        .rowD {
            float: right;
            width: 10%;
            height: 100%;
            background-color: greenyellow;
        }
        .row1-1 {
            width: 100%;
            height: 50%;
        }
        .row1-2 {
            width: 100%;
            height: 50%;
        }
        .rowE{
            float: left;
            min-width: 40%;
            height: 100%;
            background-color: pink;

        }
        .rowF {
            float:left;
            width: 60%;
            height:100%;
            background-color: beige;
        }
        .rowG {
            float: left;
            width: 60%;
            height: 100%;
            background-color: tomato;
        }
        .rowH {
            float: left;
            width: 40%;
            height: 100%;
            background-color: dodgerblue;
        }
        
        
    </style>
</head>

<body>
    <div class = "container">
        <div class = "row1">
            <div class = "rowA">Title</div>
            <div class = "rowB">
                <div class = "row1-1">
                    <div class = "rowE"></div>
                    <div class = "rowF"></div>
                </div>
                <div class = "row1-2">
                    <div class = "rowG"></div>
                    <div class = "rowH"></div>
                </div>
            </div>
        </div>
        <div class = "row2">
            <div class = "rowC"></div>
            <div class = "rowD"></div>
        </div>
    </div>
</body>

</html>
