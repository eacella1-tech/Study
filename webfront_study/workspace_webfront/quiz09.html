<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        div {
            border: 1px solid black;
        }

        .box {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #box1 {
            top: 20%;
            left: -130px;
            position: fixed;
            width: 150px;
            height: 500px;
            background-color: black;
            color: white;
            transition: 0.5s;
            font-size: 14px;
        }
        #box1:hover {
            left: 0;
        }

        #box1>.menu {
            background-color: tomato;
            width: 100%;
            justify-content: center;
        }
        #box1>.profile:hover {
            background-color: #58575740;
            color: tomato;
            transition-duration: 0.5s;
        }

        #box1>.settings:hover {
            background-color: #58575740;
            color: tomato;
            transition-duration: 0.5s;
        }

        #box1>.notice:hover {
            background-color: #58575740;
            color: tomato;
            transition-duration: 0.5s;
        }

        #box1>.message:hover {
            background-color: #58575740;
            color: tomato;
            transition-duration: 0.5s;
        }

        #box1>div {
            height: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box1 i {
            margin-right: 5px;
        }

        #box1>div:hover {
            cursor: pointer;
        }

        #box2 {
            width: 400px;
            height: 5000px;
            position: relative;
            display: flex;
            justify-self: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div id="box1" class="box">
        <div class="menu">QUICK MENU</div>
        <div class="profile">
            <i class="fa-solid fa-user"></i>
            Profile</div>
        <div class="settings">
            <i class="fa-solid fa-gear"></i>
            Settings</div>
        <div class="notice">
            <i class="fa-solid fa-bell"></i>
            Notice</div>
        <div class="message">
            <i class="fa-regular fa-message"></i>
            Message</div>
        <div class="sub1"></div>
        <div class="sub2"></div>
    </div>
    <div id="box2" class="box"></div>
</body>

</html>
