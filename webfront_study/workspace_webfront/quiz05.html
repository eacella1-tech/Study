<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            width: 400px;
            height: 600px;
            margin: auto;
        }
        
        .box {
            width: 100%;
            height: 10%;
            text-align: center;
            background-color: blue;
            color: white;
            line-height: 59.8px;
        }
        .box1 {
            float: left;
            width: 50%;
            height: 100%;
        }
        .box1-1 {
            width: 100%;
            height: 55%;
            background-color: red;
        }
        .box1-2 {
            width: 100%;
            height: 35%;
            background-color: blue;
        }
        .box1-3 {
            width: 100%;
            height: 35%;
            background-color: pink;
        }
        .box1-4 {
            width: 100%;
            height: 55%;
            background-color: ivory;
        }
    </style>
</head>

<body>
    <div class = "container">
        <div class = "box"><h1>title</h1></div>
        <div class = "box1">
            <div class="box1-1"></div>
            <div class="box1-2"></div>
        </div>
        <div class = "box1">
            <div class = "box1-3"></div>
            <div class = "box1-4"></div>
        </div>
    </div>
    
</body>

</html>
