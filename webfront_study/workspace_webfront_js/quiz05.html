<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        div {
            border: 2px solid black
        }

        .container {
            width: 300px;
            height: 300px;
            margin: auto;
        }

        .container>div {
            height: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 20px;
        }

        button {
            width: 30%;
            height: 100%;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div><input id="box1" type="text" placeholder="첫 번째 수"></div>
        <div><input id="box2" type="text" placeholder="두 번째 수"></div>
        <div><button id="box3">+</button></div>
        <div><input id="box4" type="text"></div>
    </div>
    <script>
        let num1 = document.getElementById("box1");
        let num2 = document.getElementById("box2");
        let btn = document.getElementById("box3")
        let result = document.getElementById("box4");

        btn.onclick = function () {
            let sum = Number(num1.value) + Number(num2.value);
            result.value = sum;
            num1.value = "";
            num2.value = "";
        }
    </script>

</body>

</html>
