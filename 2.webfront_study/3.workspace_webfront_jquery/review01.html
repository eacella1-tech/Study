<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        div {
            border : 2px solid black;
        }
        #box {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        
    </style>
</head>

<body>
    <input type="text" id="message"><button id="btn">테스트</button>
    <div id="box">TEST</div>
    <script>
        
        $("#btn").on("click", function(){
            $("#box").html($("#message").val());
            $("#message").val("");
        })
    </script>
</body>

</html>
