<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <fieldset>
        <legend>데이터 입력</legend>
        <input type="text" placeholder="input title" id="title"><br>
        <input type="text" placeholder="input contents" id="contents"><br>
        <input type="text" placeholder="input writer" id="writer"> <button id="input">입력</button><br>
        <hr>
        <input type="text" placeholder="input contents to delete" id="delTarget"> <button id="del">삭제</button>
    </fieldset>
    <hr>
    <table border="1" id="table">
        <tr>
            <th>Title</th>
            <th>Contents</th>
            <th>Writer</th>
        </tr>
    </table>

    <script>

        $("#del").on("click", function () {
            for (let td of $(".contents")) {
                if ($(td).html() == $("#delTarget").val()) {
                    $(td).parent().remove();
                    $("#delTarget").val("");
                    return; // 검색된 내용을 모두 지우려면 return을 삭제
                    // 처음 발견된 하나만 지우고 중단하려면 return 을 포함
                }
            }
        })

        $("#input").on("click", function () {
            let title = $("#title").val();
            let contents = $("#contents").val();
            let writer = $("#writer").val();

            let tr = $("<tr>");
            let tdTitle = $("<td>");
            tdTitle.html(title);

            let tdContents = $("<td>");
            tdContents.attr("class", "contents");
            tdContents.html(contents);

            let tdWriter = $("<td>");
            tdWriter.html(writer);

            tr.append(tdTitle, tdContents, tdWriter);
            $("#table").append(tr);

            $("#title").val("");
            $("#contents").val("");
            $("#writer").val("");
        });



    </script>

</body>

</html>
