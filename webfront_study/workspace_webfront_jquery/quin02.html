<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div><p>P1</p></div>
    <div><p>P2</p></div>
    <div><p>P3</p></div>
    <div><p>P4</p></div>
    <input id="row" type="text" placeholder="줄 번호를 입력하세요.">
    <input id="color" type="text" placeholder="색을 입력하세요.">
    <button id="btn">적용</button>
    <script>
        $("#btn").on("click", function(){
            let row = $("#row").val();
            let color = $("#color").val();
            $("div:nth-child(" + row + ")").css("background-color", color);
            $("#row").val("");
            $("#color").val("");
            $("#row").focus();
        })
    </script>
</body>

</html>
