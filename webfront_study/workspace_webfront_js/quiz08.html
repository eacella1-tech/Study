<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        div {
            border: 2px solid black;
        }

        .container {
            width: 400px;
            height: 250px;
            margin: 50px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #coordinate {
            margin-left: 50px;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="message">마우스를 박스 위에 올려보세요!</div>
    </div>

    <div id="coordinate"></div>

    <script>
        let container = document.querySelector(".container");
        let message = document.getElementById("message");
        let coordinate = document.getElementById("coordinate");

        container.onmouseenter = function () {
            message.textContent = "마우스 진입 감지!";
        };

        container.onmousemove = function (e) {
            coordinate.textContent = e.clientX + " : " + e.clientY;
        };
        container.onmouseleave = function () {
            message.textContent = "마우스 아웃 감지!";
        };
        container.onclick = function () {
            message.textContent = "마우스 클릭 감지!";
        }
        container.ondblclick = function () {
            message.textContent = "마우스 더블 클릭 감지!";
        }
        container.onmousedown = function () {
            message.textContent = "마우스 누르고 있음 감지!";
        }
    </script>
</body>

</html>
