<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
        .box {
            width: 400px;
            height: 400px;
            margin: auto;
            border: 1px solid black;
            overflow-y: auto;
            text-align: center;
        }

        .button {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="button">
        <button id="addbtn">위로 추가하기</button>
        <button id="downbtn">아래로 추가하기</button>
    </div>
    <script>
        let count = 0;

        let addbtn = $("#addbtn");
        let downbtn = $("#downbtn");
        let box = $(".box");
        

        addbtn.on("click", function(){
            let message = "Contents Message Here : " + count + "<br>";
            box.prepend(message);
            count ++;
        })
        downbtn.on("click", function(){
            let message = "Contents Message Here : " + count + "<br>";
            box.append(message);
            count ++;
        })
    </script>
</body>

</html>
